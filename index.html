<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's Portfolio</title>
</head>

<body>
    <h1>Hey there, welcome to my world! Enjoy your stay </h1>
    <p>This portfolio was deployed using Terraform by Peter, hope you like it:)</p>
    <p>Visitors: <span id="visitor-count">Loading...</span></p>

        fetch("https://75bvar4hjk.execute-api.us-east-1.amazonaws.com/count")

                document.getElementById("visitor-count").innerText = data.count;
            });
    </script>
